<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1d1d1f" />
    <title>DuText</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark">DuText</span>
        <span class="promise">你来画，我来排版</span>
      </div>

      <div class="tools" role="toolbar">
        <div class="btn-group">
          <button type="button" id="btn-undo" class="tbtn quiet" title="撤销（Ctrl+Z）">撤销</button>
          <button type="button" id="btn-redo" class="tbtn quiet" title="重做（Ctrl+Shift+Z）">重做</button>
          <button type="button" id="btn-clear" class="tbtn quiet" title="清空笔迹">清空</button>
        </div>

        <div class="seg" role="group" aria-label="画笔工具">
          <button type="button" id="tool-ellipse" class="seg-btn layout-only is-on" data-tool="ellipse">圈选</button>
          <button type="button" id="tool-pen" class="seg-btn" data-tool="pen">画笔</button>
          <button type="button" id="tool-rect" class="seg-btn compose-only" data-tool="rect">矩形</button>
          <button type="button" id="tool-arrow" class="seg-btn compose-only" data-tool="arrow">箭头</button>
          <button type="button" id="tool-black" class="seg-btn compose-only" data-tool="black">黑笔</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="btn-compose" class="tbtn quiet" title="单页自由排版">画版</button>
        <div class="menu-wrap">
          <button type="button" id="btn-menu" class="tbtn quiet" aria-haspopup="true" aria-expanded="false" title="更多">⋯</button>
          <div id="menu-popover" class="popover" hidden>
            <div class="pop-section">
              <p class="pop-title">文档</p>
              <button type="button" id="btn-sample" class="pop-item">载入示例文档</button>
              <label class="pop-item file">
                导入 .tex
                <input id="file-input" type="file" accept=".tex" hidden />
              </label>
              <button type="button" id="btn-download" class="pop-item">下载当前稿 PDF</button>
            </div>
            <div class="pop-section">
              <p class="pop-title">DeepSeek 密钥</p>
              <div class="pop-keyrow">
                <input id="api-key" type="password" placeholder="粘贴 API Key" autocomplete="off" />
                <button type="button" id="btn-save-key" class="tbtn small">保存</button>
              </div>
              <p class="pop-note">状态：<span id="key-state" class="key-state">未配置</span></p>
            </div>
            <div class="pop-section">
              <p class="pop-title">手势</p>
              <ul class="pop-legend">
                <li><i class="sw" data-g="0"></i>圈选文字 + 旁边画感叹号 → 加粗</li>
                <li><i class="sw" data-g="0"></i>矩形圈文字，箭头拉到右侧同色目标框</li>
                <li><i class="sw" data-g="3"></i>黑笔画版面线条与模板</li>
              </ul>
            </div>
          </div>
        </div>
        <button type="button" id="btn-finish" class="tbtn primary btn-finish">完成</button>
        <button type="button" id="btn-generate" class="tbtn primary btn-generate">排一版</button>
      </div>
    </header>

    <main class="workspace">
      <div class="workspace-core" id="core">
        <section class="pane" id="pane-left">
          <div class="pane-head">
            <div class="pane-head-row">
              <h1 id="left-title">当前稿</h1>
              <div class="pager">
                <button type="button" id="prev-page" class="tbtn tiny">上一页</button>
                <span id="page-label">1 / 1</span>
                <button type="button" id="next-page" class="tbtn tiny">下一页</button>
              </div>
            </div>
            <p id="left-hint">右键或 Ctrl+滚轮结束一条指令；普通滚轮上下滑动。一次最多三条。</p>
            <div class="ink-row">
              <span class="ink-dot" id="ink-dot"></span>
              <span id="ink-label">指令 1／3 · 红</span>
            </div>
          </div>
          <div class="scroll" id="scroll-left">
            <div class="sheet" id="sheet-left">
              <canvas id="pdf-left"></canvas>
              <canvas id="overlay-left"></canvas>
            </div>
          </div>
        </section>

        <aside class="gutter" aria-label="接受或打回">
          <button type="button" id="btn-accept" class="gbtn accept" title="收下右边这一版">
            <span class="dir">←</span>
            <span>收下</span>
          </button>
          <button type="button" id="btn-reject" class="gbtn" title="丢掉这次提案">
            <span class="dir">→</span>
            <span>打回</span>
          </button>
        </aside>

        <section class="pane" id="pane-right">
          <div class="pane-head">
            <div class="pane-head-row">
              <h1 id="right-title">提案</h1>
            </div>
            <p id="right-hint">编译后的结果。不满意就打回。</p>
          </div>
          <div class="scroll" id="scroll-right">
            <div class="sheet" id="sheet-right">
              <canvas id="pdf-right"></canvas>
              <canvas id="overlay-right"></canvas>
            </div>
          </div>
        </section>

        <canvas id="overlay-bridge"></canvas>
      </div>

      <aside class="prompt-dock" id="prompt-dock" aria-label="指令备注">
        <div class="prompt-dock-inner">
          <h2>指令备注</h2>
          <p class="dock-hint">每条对应一种笔迹。这里写的会和系统说明一起发给 AI。</p>
          <label class="prompt-card" data-group="0">
            <span>指令 1 · 红</span>
            <textarea data-group="0" placeholder="例如：宋体、行距 1.5"></textarea>
          </label>
          <label class="prompt-card" data-group="1">
            <span>指令 2 · 黄</span>
            <textarea data-group="1" placeholder="这条指令的额外约束"></textarea>
          </label>
          <label class="prompt-card" data-group="2">
            <span>指令 3 · 蓝</span>
            <textarea data-group="2" placeholder="这条指令的额外约束"></textarea>
          </label>
          <label class="prompt-card" data-group="3">
            <span>指令 4 · 黑笔版面</span>
            <textarea data-group="3" placeholder="例如：底部一条黑实线"></textarea>
          </label>
        </div>
      </aside>
    </main>

    <button type="button" id="ai-fab" class="ai-fab" title="打开指令备注">AI</button>

    <footer class="status" id="status">先在 ⋯ 菜单里保存 API Key。红黄蓝各算一条指令；右键或 Ctrl+滚轮确认后换色。</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
